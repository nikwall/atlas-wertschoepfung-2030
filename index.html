@font-face { font-family: "Roboto"; font-style: normal; font-weight: 300 500; font-display: swap; src: url(_assets/fonts/roboto-latin.woff2) format("woff2"); }
:root { --bg: #fbfcfa; --ink: #2f3639; --muted: #5c7062; --green: #135b49; --sage: #9dc09f; --crimson: #bb2649; --line: #d7e1d2; --surface: #ffffff; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1714; --ink: #e4ebe5; --muted: #a2b5a9; --green: #8fc9ae; --line: #2b3b35; --surface: #15201c; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Roboto", "Segoe UI", Arial, sans-serif; font-weight: 300; font-size: 16px; line-height: 1.5; }
.topbar { height: 8px; width: min(60%, 640px); margin: 0 auto; background: var(--crimson); }
main { max-width: 560px; margin: 0 auto; padding: 64px 16px 40px; display: flex; flex-direction: column; gap: 18px; }
.logo { height: 34px; width: auto; align-self: flex-start; }
.logo.neg { display: none; }
@media (prefers-color-scheme: dark) { .logo.pos { display: none; } .logo.neg { display: block; } }
h1 { margin: 8px 0 0; font-family: "Roboto Condensed", "Roboto", Arial, sans-serif; font-weight: 700; font-size: 34px; line-height: 1.1; color: var(--crimson); }
p { margin: 0; }
#msg { font-size: 17px; }
form { display: flex; flex-direction: column; gap: 8px; }
form[hidden] { display: none; }
label { font-size: 14px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
input { font: inherit; font-size: 17px; letter-spacing: .06em; padding: 9px 12px; border: 1px solid var(--sage); border-radius: 10px; background: var(--surface); color: var(--ink); flex: 1; min-width: 0; }
button { font: inherit; font-weight: 500; font-size: 15px; color: #fff; background: #135b49; border: 0; border-radius: 22px; padding: 9px 18px; cursor: pointer; }
.err { color: var(--crimson); font-size: 14px; min-height: 1.5em; }
.ft { margin-top: 28px; border-top: 2px solid #135b49; padding-top: 12px; font-size: 13px; color: var(--muted); }
.ft a { color: var(--green); }

  const T = { falsch: "Der Code passt nicht. Bitte prüfen Sie den Link oder den Code aus unserer Mail.", ohne: "Bitte geben Sie den Zugangscode aus unserer Mail ein.", alt: "Dieser Browser kann den Atlas nicht öffnen. Bitte nutzen Sie einen aktuellen Browser." };
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const norm = s => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

  async function open(code) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(norm(code)), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.it, hash: "SHA-256" },

    document.open(); document.write(html); document.close();

  function ask(text) { msg.textContent = text; form.hidden = false; document.getElementById("code").focus(); }
